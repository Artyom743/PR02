name: ROS checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full@sha256:d16957210572c5f919f3f9bd2fb0cc24a82542647489d8b8eda7c3beda31305f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup patrol
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
      - name: Run unit tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -s -m pytest src/patrol/test
      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w04-fec6b4e886c1.tar.gz"
          printf 'fec6b4e886c19146078bf69fbf90a19279a4cd33f656642395350b299efeb226  course-kit.tar.gz\n' | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
      - name: Check PR evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR04 --submission .